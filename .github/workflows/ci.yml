name: CI

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  validate:
    name: Validate backend and frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SECRET_KEY: test-ci-7f4b9c2e1a8d6f0b3c5e9a7d2f4b8c1e
      PBKDF2_SALT: test-salt-ci-4d8a1f6c9b2e7a5d
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest pytest-asyncio pytest-cov httpx
      - name: Run backend tests
        working-directory: backend
        run: python -m pytest tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run typecheck --prefix frontend
      - run: npm run lint --prefix frontend
      - run: npm run build --prefix frontend

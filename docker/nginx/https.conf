# HTTPS (enabled automatically when /etc/nginx/certs/tls.crt and tls.key exist).
# Port 80 only answers the health check and redirects everything else to HTTPS.
server {
  listen 80;
  server_name _;

  location = /healthz {
    access_log off;
    return 200 'ok\n';
    add_header Content-Type text/plain;
  }

  location / {
    return 301 https://$host__HTTPS_PORT_SUFFIX__$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name _;

  # tls.crt: server certificate followed by the intermediate CA certificates (full chain).
  ssl_certificate /etc/nginx/certs/tls.crt;
  ssl_certificate_key /etc/nginx/certs/tls.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;

  include /etc/nginx/funcassist/server-common.conf;
}

name: funcassist
services:
  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/${GHCR_OWNER:-owner}/funcassist-frontend}:${APP_VERSION:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      tags:
        - ${FRONTEND_IMAGE:-ghcr.io/${GHCR_OWNER:-owner}/funcassist-frontend}:${APP_VERSION:-latest}
        - ${FRONTEND_IMAGE:-ghcr.io/${GHCR_OWNER:-owner}/funcassist-frontend}:latest
    restart: unless-stopped
    ports: ["${APP_PORT:-6728}:80"]
    depends_on:
      backend: { condition: service_healthy }
    healthcheck: { test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"], interval: 30s, timeout: 5s, retries: 3 }
  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/${GHCR_OWNER:-owner}/funcassist-backend}:${APP_VERSION:-latest}
    build:
      context: .
      dockerfile: backend/Dockerfile
      tags:
        - ${BACKEND_IMAGE:-ghcr.io/${GHCR_OWNER:-owner}/funcassist-backend}:${APP_VERSION:-latest}
        - ${BACKEND_IMAGE:-ghcr.io/${GHCR_OWNER:-owner}/funcassist-backend}:latest
    restart: unless-stopped
    expose: ["8000"]
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:6728}
      BACKEND_URL: http://backend:8000
      DATABASE_URL: postgresql://${POSTGRES_USER:-funcassist}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:-funcassist}
      REDIS_URL: redis://redis:6379
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      PBKDF2_SALT: ${PBKDF2_SALT:?PBKDF2_SALT is required}
      DATA_DIR: /app/data
      KNOWLEDGE_DATA_DIR: /app/knowledge_data
    volumes: [funcassist_data:/app/data, funcassist_knowledge:/app/knowledge_data]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck: { test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"], interval: 30s, timeout: 10s, start_period: 60s, retries: 5 }
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-funcassist}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-funcassist}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"], interval: 10s, timeout: 5s, retries: 5 }
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis_data:/data]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 10s, timeout: 5s, retries: 5 }
volumes:
  funcassist_data:
  funcassist_knowledge:
  postgres_data:
  redis_data:

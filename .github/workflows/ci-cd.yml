name: CI/CD Pipeline - Build & Release

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - develop

env:
  RUST_BACKTRACE: 1
  NODE_VERSION: '20'

jobs:
  # ============================================================================
  # PHASE 1: TEST SUITE
  # ============================================================================
  test:
    name: Run Tests & Type Checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx

      - name: Run Backend Tests
        run: |
          cd backend
          pytest tests/ -v --cov=app --cov-report=xml || echo "Pytest completed with status $?"

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v4
        continue-on-error: true
        with:
          files: ./backend/coverage.xml
          flags: backend
          name: backend-coverage
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Setup Frontend dependencies
        run: npm ci --prefix frontend

      - name: Run Frontend Type Check
        run: npm run typecheck --prefix frontend

      - name: Run Frontend Linter
        run: npm run lint --prefix frontend || echo "Linting completed"

  # ============================================================================
  # PHASE 2: BUILD FRONTEND
  # ============================================================================
  build:
    name: Build Frontend Bundle
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci --prefix frontend

      - name: Build Frontend
        run: npm run build --prefix frontend
        env:
          VITE_API_BASE: 'http://localhost:8000'

      - name: Upload Frontend Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  # ============================================================================
  # PHASE 3: BUILD TAURI WINDOWS RELEASE
  # ============================================================================
  build-tauri:
    name: Build Tauri Windows App
    needs: build
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install WebView2 Runtime
        shell: powershell
        run: |
          Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile 'MicrosoftEdgeWebView2RuntimeInstallerX64.exe'
          Start-Process -FilePath '.\MicrosoftEdgeWebView2RuntimeInstallerX64.exe' -ArgumentList '/silent /install' -Wait

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Install root & frontend dependencies
        run: |
          npm ci
          npm ci --prefix frontend

      - name: Build Frontend
        run: npm run build --prefix frontend
        env:
          VITE_API_BASE: 'http://localhost:8000'

      - name: Build Tauri Desktop
        run: npx @tauri-apps/cli build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

      - name: Upload Tauri Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tauri-windows-release
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.zip
          retention-days: 5
          if-no-files-found: warn

  # ============================================================================
  # PHASE 4: CREATE GITHUB RELEASE
  # ============================================================================
  release:
    name: Create GitHub Release
    needs: build-tauri
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Tauri artifacts
        uses: actions/download-artifact@v4
        with:
          name: tauri-windows-release
          path: ./artifacts

      - name: Create Release Notes
        id: release_notes
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          cat << 'EOF' > RELEASE_NOTES.md
          ## QA Project Management Release $VERSION

          ### Highlights & Changes
          - Automated Build & Release generated via GitHub Actions
          - Local AI Integration & Fast QA Dashboard
          - Automatic desktop updater support

          ### Downloads & Installation
          - **Windows Installer (MSI):** Check release assets below
          - **Windows Portable / NSIS:** Check release assets below

          ### Upgrade Instructions
          - If you already have QA Project Management installed, the in-app updater will notify you automatically.
          - Or download and run the latest installer attached to this release.
          EOF
          sed -i "s/\$VERSION/$VERSION/g" RELEASE_NOTES.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.msi
            artifacts/**/*.exe
            artifacts/**/*.zip
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

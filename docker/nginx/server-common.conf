# Settings shared by the HTTP and HTTPS server blocks.
root /usr/share/nginx/html;

client_max_body_size 5192M;
client_body_timeout 1800s;
client_header_timeout 1800s;
send_timeout 1800s;

location = /healthz {
  access_log off;
  return 200 'ok\n';
  add_header Content-Type text/plain;
}

location /api/ {
  proxy_pass http://backend:8000/api/;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  proxy_connect_timeout 600s;
  proxy_send_timeout 1800s;
  proxy_read_timeout 1800s;
  proxy_request_buffering off;
}

# Vite emits content-hashed file names under /assets/: a new build gets new URLs, so these can
# be cached for a year without ever serving a stale bundle.
location /assets/ {
  try_files $uri =404;
  add_header Cache-Control "public, max-age=31536000, immutable";
}

# index.html points at the current hashed bundle. It must be revalidated on every load, or
# browsers keep running the previous build against a newer backend after a deploy.
location = /index.html {
  add_header Cache-Control "no-cache, must-revalidate";
  include /etc/nginx/funcassist/security-headers.conf;
}

location / {
  try_files $uri $uri/ /index.html;
  add_header Cache-Control "no-cache";
  include /etc/nginx/funcassist/security-headers.conf;
}

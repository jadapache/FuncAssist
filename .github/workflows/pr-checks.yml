name: PR Checks

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  lint-and-test:
    name: Code Quality & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install Python dependencies & tools
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install flake8 black pytest pytest-asyncio pytest-cov httpx

      - name: Lint Python Code
        run: |
          flake8 backend/app --max-line-length=120 --count --statistics || true
          black --check backend/app || true

      - name: Lint & Typecheck Frontend
        run: |
          npm ci --prefix frontend
          npm run typecheck --prefix frontend
          npm run lint --prefix frontend || true

      - name: Run Backend Tests
        run: |
          cd backend
          pytest tests/ -v || echo "Tests completed"

      - name: Check Frontend Build
        run: npm run build --prefix frontend

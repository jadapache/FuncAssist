# HTTPS-only server configuration (SEC-06). Certificate: /etc/nginx/certs/tls.crt + tls.key.
# Port 80 is not published (internal health check only) and redirects everything else to HTTPS.
server {
  listen 80;
  server_name _;

  location = /healthz {
    access_log off;
    return 200 'ok\n';
    add_header Content-Type text/plain;
  }

  location / {
    return 301 https://$host__HTTPS_PORT_SUFFIX__$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name _;

  # tls.crt: server certificate followed by the intermediate CA certificates (full chain).
  ssl_certificate /etc/nginx/certs/tls.crt;
  ssl_certificate_key /etc/nginx/certs/tls.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;

  # plain HTTP sent to the TLS port.
  error_page 497 =301 https://$host:$server_port$request_uri;
  add_header Strict-Transport-Security "max-age=31536000" always;

  include /etc/nginx/funcassist/server-common.conf;
}

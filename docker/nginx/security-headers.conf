# Response headers for the HTML documents.
# `add_header` inside a location replaces the headers inherited from the server block, so this file is
# included in every location that serves the application shell.
#
# img-src is the directive that matters here: a markdown image in a model answer would otherwise be
# requested from any host, which lets text taken from external content send data out in the URL.
# Other fetch directives are left unset on purpose: the browser-side models (Whisper, WebLLM) load
# weights and workers from other origins.
add_header Content-Security-Policy "img-src 'self' data: blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;

name: CI

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  validate:
    name: Validate backend and frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SECRET_KEY: test-ci-7f4b9c2e1a8d6f0b3c5e9a7d2f4b8c1e
      PBKDF2_SALT: test-salt-ci-4d8a1f6c9b2e7a5d
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt
      - name: Audit backend dependencies (known CVEs)
        run: |
          pip install pip-audit==2.10.1
          pip-audit --strict --skip-editable
      - name: Run backend tests
        working-directory: backend
        run: python -m pytest tests --cov=app --cov-config=.coveragerc --cov-report=term-missing --cov-report=xml
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run typecheck --prefix frontend
      - run: npm run lint --prefix frontend
      - run: npm run build --prefix frontend
      - name: Audit frontend dependencies (known CVEs)
        run: npm audit --prefix frontend --omit=dev --audit-level=high
      - name: Generate SBOM (CycloneDX)
        run: |
          mkdir -p sbom
          pip install cyclonedx-bom==9.0.0
          cyclonedx-py requirements backend/requirements.txt --of JSON -o sbom/backend.cdx.json
          npx --yes @cyclonedx/cyclonedx-npm@7.0.1 --package-lock-only --omit dev --output-file sbom/frontend.cdx.json frontend/package.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom/

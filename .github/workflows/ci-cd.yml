name: CI/CD Pipeline - Build & Release

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - develop

env:
  NODE_VERSION: '24'

jobs:
  # ============================================================================
  # PHASE 1: TEST SUITE
  # ============================================================================
  test:
    name: Run Tests & Type Checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx

      - name: Run Backend Tests
        working-directory: backend
        run: |
          python -m pytest tests/ -v --cov=app --cov-report=xml

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v5
        continue-on-error: true
        with:
          files: ./backend/coverage.xml
          flags: backend
          name: backend-coverage
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Install Frontend Dependencies
        run: npm ci --prefix frontend

      - name: Run Frontend Type Check
        run: npm run typecheck --prefix frontend

      - name: Run Frontend Linter
        run: npm run lint --prefix frontend

  # ============================================================================
  # PHASE 2: BUILD FRONTEND
  # ============================================================================
  build:
    name: Build Frontend Bundle
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci --prefix frontend

      - name: Build Frontend
        run: npm run build --prefix frontend
        env:
          VITE_API_BASE: 'http://localhost:8000'

      - name: Upload Frontend Build Artifact
        uses: actions/upload-artifact@v6
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  # ============================================================================
  # PHASE 3: CREATE GITHUB RELEASE
  # ============================================================================
  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Download Frontend Build Artifact
        uses: actions/download-artifact@v6
        with:
          name: frontend-dist
          path: ./dist

      - name: Package Frontend Artifact
        shell: bash
        run: |
          tar -czf funcassist-frontend-dist.tar.gz -C dist .

      - name: Create Release Notes
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"

          cat > RELEASE_NOTES.md <<EOF
          ## FuncAssist Release ${VERSION}

          ### Highlights & Changes
          - Automated Build & Release generated via GitHub Actions
          - AI Functional Assistant & Elicitation Hub (Web / SaaS)
          EOF

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: funcassist-frontend-dist.tar.gz
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
